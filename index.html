    // MCTS Node Class with proper adversarial UCB
    class MCTSNode {
        constructor(gameState, move = null, parent = null) {
            this.gameState = new Chess(gameState.fen());
            this.move = move;
            this.parent = parent;
            this.children = [];
            this.visits = 0;
            this.value = 0; // accumulated "from White's perspective" scores
            this.playerToMove = this.gameState.turn(); // 'w' or 'b'
            this.untriedMoves = this.gameState.moves({ verbose: true });
        }

        isFullyExpanded() {
            return this.untriedMoves.length === 0;
        }

        // White tries to maximize White's eval; Black tries to minimize it
        bestChild(explorationParam = 1.41) {
            let bestScore = -Infinity;
            let bestChild = null;
            const isWhiteToMove = (this.playerToMove === 'w');

            for (const child of this.children) {
                const qWhite = child.value / (child.visits + 1e-8); // avg from White's perspective

                // If it's White's turn at this node, larger qWhite is better.
                // If it's Black's turn, smaller qWhite is better → multiply by -1.
                const exploitation = isWhiteToMove ? qWhite : -qWhite;
                const exploration = Math.sqrt(
                    Math.log(this.visits + 1) / (child.visits + 1e-8)
                );
                const uct = exploitation + explorationParam * exploration;

                if (uct > bestScore) {
                    bestScore = uct;
                    bestChild = child;
                }
            }

            return bestChild;
        }

        expand() {
            const move = this.untriedMoves.pop();
            const newGame = new Chess(this.gameState.fen());
            newGame.move(move);
            const childNode = new MCTSNode(newGame, move, this);
            this.children.push(childNode);
            return childNode;
        }
    }

    // Enhanced board encoding with more features
    function boardToTensor(fen) {
        const chess = new Chess(fen);
        const board = chess.board();
        const input = new Float32Array(896);  // Increased features
        
        const pieceMap = {
            'p': 0, 'n': 1, 'b': 2, 'r': 3, 'q': 4, 'k': 5,
            'P': 6, 'N': 7, 'B': 8, 'R': 9, 'Q': 10, 'K': 11
        };

        // Piece positions (768 features)
        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
                const piece = board[i][j];
                if (piece) {
                    const pieceIdx = pieceMap[piece.color === 'w' ? piece.type.toUpperCase() : piece.type];
                    input[(i * 8 + j) * 12 + pieceIdx] = 1;
                }
            }
        }

        // Mobility features (64 features)
        let offset = 768;
        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
                const square = String.fromCharCode('a'.charCodeAt(0) + j) + (8 - i);
                const moves = chess.moves({ square, verbose: true });
                input[offset++] = Math.min(moves.length / 10.0, 1.0);
            }
        }

        // Additional features (64 features)
        offset = 832;
        // Center control
        const centerSquares = ['d4', 'd5', 'e4', 'e5'];
        for (const sq of centerSquares) {
            const piece = chess.get(sq);
            input[offset++] = piece && piece.color === 'w' ? 1 : 0;
            input[offset++] = piece && piece.color === 'b' ? 1 : 0;
        }
        
        // Castling rights (these depend on chess.js internals; may effectively be 0s)
        input[offset++] = chess.castling && (chess.castling.w & chess.castling.KING_SIDE) ? 1 : 0;
        input[offset++] = chess.castling && (chess.castling.w & chess.castling.QUEEN_SIDE) ? 1 : 0;
        input[offset++] = chess.castling && (chess.castling.b & chess.castling.KING_SIDE) ? 1 : 0;
        input[offset++] = chess.castling && (chess.castling.b & chess.castling.QUEEN_SIDE) ? 1 : 0;
        
        // King safety (again, depends on chess.js internals, kept as in original)
        const wKingSquare = chess.SQUARES && chess.kings ? chess.SQUARES[chess.kings.w] : null;
        const bKingSquare = chess.SQUARES && chess.kings ? chess.SQUARES[chess.kings.b] : null;
        input[offset++] = wKingSquare ? (wKingSquare.charCodeAt(0) - 97) / 7.0 : 0;
        input[offset++] = wKingSquare ? parseInt(wKingSquare[1]) / 8.0 : 0;
        input[offset++] = bKingSquare ? (bKingSquare.charCodeAt(0) - 97) / 7.0 : 0;
        input[offset++] = bKingSquare ? parseInt(bKingSquare[1]) / 8.0 : 0;
        
        // Game phase (remaining material)
        let totalMaterial = 0;
        for (let row of board) {
            for (let p of row) {
                if (p && p.type !== 'k') {
                    totalMaterial += PIECE_VALUES[p.type] || 0;
                }
            }
        }
        input[offset++] = Math.min(totalMaterial / 78.0, 1.0);  // Normalize by max material
        
        // Turn to move
        input[offset++] = chess.turn() === 'w' ? 1 : 0;
        
        return tf.tensor2d([input], [1, 896]);
    }

    // Improved model with more capacity
    function createEnhancedModel() {
        const model = tf.sequential();
        
        // Input layer with more neurons
        model.add(tf.layers.dense({ 
            units: 256, 
            activation: 'relu', 
            inputShape: [896],
            kernelRegularizer: tf.regularizers.l2({ l2: 0.0001 })
        }));
        model.add(tf.layers.dropout({ rate: 0.3 }));
        
        // Hidden layers
        model.add(tf.layers.dense({ 
            units: 256, 
            activation: 'relu',
            kernelRegularizer: tf.regularizers.l2({ l2: 0.0001 })
        }));
        model.add(tf.layers.dropout({ rate: 0.3 }));
        
        model.add(tf.layers.dense({ 
            units: 128, 
            activation: 'relu',
            kernelRegularizer: tf.regularizers.l2({ l2: 0.0001 })
        }));
        model.add(tf.layers.dropout({ rate: 0.2 }));
        
        model.add(tf.layers.dense({ 
            units: 64, 
            activation: 'relu'
        }));
        
        // Output layer
        model.add(tf.layers.dense({ units: 1, activation: 'tanh' }));
        
        model.compile({ 
            optimizer: tf.train.adam(0.0005),  // Lower learning rate
            loss: 'meanSquaredError',
            metrics: ['mae']
        });
        
        return model;
    }

    // FIXED: Proper base64 conversion without stack overflow
    function arrayBufferToBase64(buffer) {
        // Use Array.from with map to avoid stack overflow
        const bytes = new Uint8Array(buffer);
        const binary = Array.from(bytes, byte => String.fromCharCode(byte)).join('');
        return btoa(binary);
    }

    // Helper to convert base64 back to ArrayBuffer
    function base64ToArrayBuffer(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return bytes.buffer;
    }

    // Enhanced evaluation with positional understanding
    async function evaluateBoard(fen) {
        const chess = new Chess(fen);
        
        // Material count
        let material = 0;
        const board = chess.board();
        for(let row of board) {
            for(let p of row) {
                if(p) {
                    const val = PIECE_VALUES[p.type] || 0;
                    material += (p.color === 'w' ? val : -val);
                }
            }
        }
        
        // Center control
        let centerControl = 0;
        const centerSquares = ['d4', 'd5', 'e4', 'e5'];
        for (const sq of centerSquares) {
            const piece = chess.get(sq);
            if (piece) {
                const value = piece.type === 'p' ? 0.5 : 1;
                centerControl += piece.color === 'w' ? value : -value;
            }
        }
        
        // Mobility
        let whiteMoves, blackMoves;
        const originalFen = chess.fen();

        // White mobility
        if (chess.turn() !== 'w') {
            const parts = originalFen.split(' ');
            parts[1] = 'w';
            chess.load(parts.join(' '));
        }
        whiteMoves = chess.moves().length;

        // Black mobility
        chess.load(originalFen);
        const parts2 = originalFen.split(' ');
        parts2[1] = 'b';
        try {
            chess.load(parts2.join(' '));
            blackMoves = chess.moves().length;
        } catch(e) {
            blackMoves = 0;
        }

        // Restore original state (not strictly necessary since we don't reuse chess)
        const mobility = (whiteMoves - blackMoves) / 20.0;
        
        // Heuristic combination
        const heuristic = Math.tanh(
            (material / 20.0) + 
            (centerControl / 4.0) + 
            (mobility * 0.3)
        );

        // Neural network evaluation
        const tensor = boardToTensor(fen);
        const prediction = aiModel.predict(tensor);
        const nnValue = (await prediction.data())[0];
        tensor.dispose();
        prediction.dispose();

        // Blend heuristic and neural network (more weight on NN as it trains)
        return (heuristic * 0.4) + (nnValue * 0.6);  // from White's perspective
    }

    // MCTS Implementation (adversarial, White-perspective eval)
    async function runMCTS(rootState, simulations) {
        const root = new MCTSNode(rootState);

        for (let i = 0; i < simulations; i++) {
            let node = root;
            const simGame = new Chess(rootState.fen());

            // Selection
            while (node.isFullyExpanded() && node.children.length > 0 && !simGame.game_over()) {
                node = node.bestChild();
                simGame.move(node.move);
            }

            // Expansion
            if (!simGame.game_over() && node.untriedMoves.length > 0) {
                node = node.expand();
                simGame.load(node.gameState.fen());
            }

            // Simulation / Evaluation (value from White's perspective)
            let whiteValue;
            if (simGame.game_over()) {
                if (simGame.in_checkmate()) {
                    // chess.js: turn() is the side TO MOVE. If no legal moves & in check, that side is checkmated.
                    const winnerIsWhite = simGame.turn() === 'b';
                    whiteValue = winnerIsWhite ? 1 : -1;
                } else {
                    whiteValue = 0; // draw / stalemate etc.
                }
            } else {
                whiteValue = await evaluateBoard(simGame.fen()); // your NN + heuristic, White-perspective
            }

            // Backpropagate WITHOUT sign flipping (we keep everything as "from White's perspective")
            let nodePtr = node;
            while (nodePtr !== null) {
                nodePtr.visits++;
                nodePtr.value += whiteValue;
                nodePtr = nodePtr.parent;
            }
        }

        if (root.children.length === 0) return null;

        // Build move stats: qWhite = avg eval from White's perspective
        const movesStats = root.children.map(child => ({
            move: child.move,
            visits: child.visits,
            qWhite: child.value / (child.visits + 1e-8)
        }));

        // Use most-visited move as the main "best" move
        let bestChild = root.children[0];
        for (const child of root.children) {
            if (child.visits > bestChild.visits) {
                bestChild = child;
            }
        }

        return { bestMove: bestChild.move, movesStats };
    }

    // Get Best Move (using MCTS + ε-greedy exploration)
    async function getBestMove(depth) {
        const legalMoves = game.moves({ verbose: true });
        if (legalMoves.length === 0) return null;

        updateAIState(`Thinking...`);

        const result = await runMCTS(game, MCTS_SIMULATIONS);
        if (!result) return null;

        const { bestMove, movesStats } = result;

        // ε-greedy: usually play best move, sometimes explore among top K
        let chosenMove = bestMove;
        if (Math.random() < EPSILON_EXPLORATION && movesStats.length > 1) {
            // Sort by visits, then sample from the top 3 moves
            const sorted = [...movesStats].sort((a, b) => b.visits - a.visits);
            const topK = sorted.slice(0, Math.min(3, sorted.length));
            const randomIdx = Math.floor(Math.random() * topK.length);
            chosenMove = topK[randomIdx].move;
        }

        // Confidence: convert from White's perspective to AI's perspective
        const statForChosen =
            movesStats.find(s => s.move === chosenMove) || movesStats[0];

        const whiteQ = statForChosen.qWhite;              // >0: White happy
        const aiQ = (AI_COLOR === 'w') ? whiteQ : -whiteQ; // >0: AI happy

        const confEl = document.getElementById('ai-confidence');
        if (confEl) confEl.textContent = aiQ.toFixed(3);

        return chosenMove;
    }

    async function uploadToHive(gameDataArray) {
        try {
            if (!auth.currentUser) return;
            const slotId = `slot_${Math.floor(Math.random() * HIVE_SLOTS)}`;
            const slotRef = doc(db, 'artifacts', appId, 'public', 'data', 'hive_memory', slotId);
            
            await setDoc(slotRef, {

                timestamp: Date.now(),
                contributor: auth.currentUser.uid
            });
            console.log("Contributed to Hive Mind:", slotId);
        } catch (e) {
            console.error("Hive upload failed:", e);
        }
    }

    async function fetchHiveMemories() {
        try {
            if (!auth.currentUser) return [];
            updateAIState("Syncing with Hive...");
            
            const hiveRef = collection(db, 'artifacts', appId, 'public', 'data', 'hive_memory');
            const snapshot = await getDocs(hiveRef);
            
            let collectiveMemories = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                if (data.games && Array.isArray(data.games)) {
                    collectiveMemories = [...collectiveMemories, ...data.games];
                }
            });
            
            console.log(`Downloaded ${collectiveMemories.length} positions from Hive.`);
            return collectiveMemories;
        } catch (e) {
            console.error("Hive sync failed:", e);
            return [];
        }
    }

    // IMPROVED: Record game with temporal difference reward propagation
    function recordGameData(result) {
        const tempGame = new Chess();
        const history = game.history();
        
        let currentGamePositions = [];
        
        // Build position array with FENs
        const positions = [];
        history.forEach(move => {
            positions.push(tempGame.fen());
            tempGame.move(move);
        });
        positions.push(tempGame.fen());  // Final position
        
        // Propagate rewards backwards using temporal difference
        const values = [];
        let currentValue = result;  // Final reward (from White's perspective)
        
        // Work backwards from end to start
        for (let i = positions.length - 1; i >= 0; i--) {
            values[i] = currentValue;
            // Discount factor for temporal credit assignment
            currentValue = currentValue * GAMMA;
        }
        
        // Create training data with propagated values
        for (let i = 0; i < positions.length; i++) {
            currentGamePositions.push({
                fen: positions[i],
                value: values[i]
            });
        }
        
        gameHistory = [...gameHistory, ...currentGamePositions];
        uploadToHive(currentGamePositions);
        incrementGlobalStats();
    }

    async function trainModel() {
        if (isTraining) return;
        
        isTraining = true;
        updateAIState("Training...");
        
        const overlay = document.getElementById('board-overlay');
        const trainingInd = document.getElementById('training-indicator');
        const msg = document.getElementById('overlay-msg');
        const title = document.getElementById('overlay-title');
        
        overlay.classList.remove('hidden');
        trainingInd.classList.remove('hidden');
        title.textContent = "Hive Learning";
        msg.textContent = "Community threshold reached. Upgrading brain...";
        document.getElementById('btn-overlay-new').classList.add('hidden');

        const communityGames = await fetchHiveMemories();
        const trainingSet = [...gameHistory, ...communityGames];
        msg.textContent = `Processing ${trainingSet.length} positions...`;

        if (trainingSet.length === 0) {
            finishTraining(overlay, trainingInd);
            return;
        }

        const inputs = [];
        const labels = [];
        const MAX_TRAINING_SAMPLES = 600;
        const shuffled = trainingSet.sort(() => 0.5 - Math.random()).slice(0, MAX_TRAINING_SAMPLES);

        // Build training data
        for (const record of shuffled) {
            const t = boardToTensor(record.fen);
            const d = await t.data();
            inputs.push(Array.from(d));
            labels.push(record.value);  // Using propagated values now
            t.dispose();
        }

        const inputTensor = tf.tensor2d(inputs, [inputs.length, 896]);
        const labelTensor = tf.tensor2d(labels, [labels.length, 1]);

        // Training with validation split and learning rate scheduling
        await aiModel.fit(inputTensor, labelTensor, {
            epochs: 20,
            batchSize: 32,
            shuffle: true,
            validationSplit: 0.1,
            callbacks: {
                onEpochEnd: (epoch, logs) => {
                    console.log(`Epoch ${epoch + 1}: loss=${logs.loss.toFixed(4)}, val_loss=${logs.val_loss.toFixed(4)}`);
                    msg.textContent = `Training Epoch ${epoch + 1}/20 - Loss: ${logs.loss.toFixed(4)}`;
                }
            }
        });

        inputTensor.dispose();
        labelTensor.dispose();

        modelGeneration++;
        msg.textContent = "Saving model...";
        await saveModelToFirestore(aiModel, modelGeneration);

        finishTraining(overlay, trainingInd);
    }

    function finishTraining(overlay, trainingInd) {
        isTraining = false;
        trainingPending = false;
        updateAIState("Ready");
        
        trainingInd.classList.add('hidden');
        document.getElementById('btn-overlay-new').classList.remove('hidden');
        document.getElementById('overlay-msg').textContent = "Training complete! I've learned from the community.";
    }

    function checkAndTriggerTraining() {
        if (trainingPending && !isTraining) {
            console.log("Triggering training...");
            trainModel();
        }
    }

    function updateGlobalProgressUI(globalCount) {
        const batchProgress = globalCount % GAMES_PER_TRAINING;
        const percent = Math.min(100, (batchProgress / GAMES_PER_TRAINING) * 100);
        
        document.getElementById('local-games-count').textContent = `${batchProgress} / ${GAMES_PER_TRAINING}`;
        document.getElementById('training-progress').style.width = `${percent}%`;
        document.getElementById('buffer-percent').textContent = `${Math.floor(percent)}%`;
    }

    async function handleGameOver() {
        let msg = "";
        let result = 0;

        if (game.in_checkmate()) {
            if (game.turn() === 'w') {
                msg = "Checkmate! AI (Black) Wins!";
                result = -1;  // Black (AI) wins → bad for White
            } else {
                msg = "Checkmate! You (White) Win!";
                result = 1;   // White wins
            }
        } else if (game.in_draw()) {
            msg = "Draw!";
            result = 0;
        } else {
            msg = "Game Over";
        }

        document.getElementById('overlay-msg').textContent = msg;
        document.getElementById('board-overlay').classList.remove('hidden');
        document.getElementById('training-indicator').classList.add('hidden');
        document.getElementById('overlay-title').textContent = "Game Finished";
        
        recordGameData(result);
        checkAndTriggerTraining();
    }

    // --- 3. Board Logic & UI ---

    const PIECE_UNICODE = {
        'p': '♟', 'n': '♞', 'b': '♝', 'r': '♜', 'q': '♛', 'k': '♚',
        'P': '♙', 'N': '♘', 'B': '♗', 'R': '♖', 'Q': '♕', 'K': '♔'
    };

    const PIECE_FONTAWESOME = {
        'p': 'fa-chess-pawn', 'n': 'fa-chess-knight', 'b': 'fa-chess-bishop', 
        'r': 'fa-chess-rook', 'q': 'fa-chess-queen', 'k': 'fa-chess-king',
        'P': 'fa-chess-pawn', 'N': 'fa-chess-knight', 'B': 'fa-chess-bishop', 
        'R': 'fa-chess-rook', 'Q': 'fa-chess-queen', 'K': 'fa-chess-king'
    };

    let iconStyle = localStorage.getItem('chess-icon-style') || 'unicode';

    function renderBoard() {
        const boardEl = document.getElementById('chessboard');
        boardEl.innerHTML = '';
        const boardState = game.board();
        
        if (game.game_over()) {
            handleGameOver();
        }

        let isWhiteSq = true;
        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
                const squareCode = String.fromCharCode('a'.charCodeAt(0) + j) + (8 - i);
                const squareDiv = document.createElement('div');
                
                let baseClass = "w-full h-full flex items-center justify-center text-4xl sm:text-5xl select-none square relative";
                let colorClass = isWhiteSq ? "bg-[#ebecd0] text-black" : "bg-[#779556] text-black";
                
                const history = game.history({ verbose: true });
                if (history.length > 0) {
                    const last = history[history.length - 1];
                    if (last.from === squareCode || last.to === squareCode) {
                        colorClass = isWhiteSq ? "bg-[#f5f682]" : "bg-[#baca44]";
                    }
                }

                if (selectedSquare === squareCode) {
                    colorClass = "bg-[#bbc456]";
                }

                squareDiv.className = `${baseClass} ${colorClass}`;
                squareDiv.dataset.square = squareCode;
                squareDiv.onclick = () => onSquareClick(squareCode);

                const piece = boardState[i][j];
                if (piece) {
                    const pieceSpan = document.createElement('span');
                    const pieceKey = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                    
                    if (iconStyle === 'fontawesome') {
                        const iconClass = PIECE_FONTAWESOME[pieceKey] || PIECE_FONTAWESOME[piece.type];
                        pieceSpan.innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
                        pieceSpan.className = `chess-piece ${piece.color === 'w' ? 'text-gray-100 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]' : 'text-black drop-shadow-[0_1px_1px_rgba(255,255,255,0.5)]'}`;
                        if (piece.color === 'w') {
                            pieceSpan.style.color = '#fff';
                            pieceSpan.style.textShadow = '0 0 2px #000';
                        } else {
                            pieceSpan.style.color = '#000';
                            pieceSpan.style.textShadow = '0 0 1px #fff';
                        }
                    } else {
                        pieceSpan.textContent = PIECE_UNICODE[pieceKey] || PIECE_UNICODE[piece.type];
                        pieceSpan.className = `chess-piece ${piece.color === 'w' ? 'text-gray-100 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]' : 'text-black drop-shadow-[0_1px_1px_rgba(255,255,255,0.5)]'}`;
                        if (piece.color === 'w') {
                            pieceSpan.style.color = '#fff';
                            pieceSpan.style.textShadow = '0 0 2px #000';
                        } else {
                            pieceSpan.style.color = '#000';
                            pieceSpan.style.textShadow = '0 0 1px #fff';
                        }
                    }
                    squareDiv.appendChild(pieceSpan);
                }
                
                if (selectedSquare) {
                    const moves = game.moves({ square: selectedSquare, verbose: true });
                    const isMove = moves.find(m => m.to === squareCode);
                    if (isMove) {
                        const hint = document.createElement('div');
                        hint.className = isMove.captured 
                            ? "absolute inset-0 border-4 border-red-400/50 rounded-full scale-90" 
                            : "absolute w-3 h-3 bg-black/20 rounded-full";
                        squareDiv.appendChild(hint);
                    }
                }

                boardEl.appendChild(squareDiv);
                isWhiteSq = !isWhiteSq;
            }
            isWhiteSq = !isWhiteSq;
        }
        updateStatus();
    }

    async function onSquareClick(square) {
        if (isTraining) return;
        if (game.turn() === AI_COLOR && !game.game_over()) return;

        if (selectedSquare === square) {
            selectedSquare = null;
            renderBoard();
            return;
        }

        if (selectedSquare) {
            const move = game.move({
                from: selectedSquare,
                to: square,
                promotion: 'q'
            });

            if (move) {
                selectedSquare = null;
                renderBoard();
                if (!game.game_over()) {
                    setTimeout(makeAIMove, 200);
                }
            } else {
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    renderBoard();
                } else {
                    selectedSquare = null;
                    renderBoard();
                }
            }
        } else {
            const piece = game.get(square);
            if (piece && piece.color === game.turn()) {
                selectedSquare = square;
                renderBoard();
            }
        }
    }

    async function makeAIMove() {
        if (game.game_over()) return;
        
        updateAIState("Thinking...");
        updateStatus("AI is thinking...");
        
        setTimeout(async () => {
            const move = await getBestMove(2);
            if (move) {
                game.move(move);
                renderBoard();
                updateAIState("Ready");
            }
        }, 10);
    }

    function updateStatus(msg) {
        const statusEl = document.getElementById('game-status');
        if (msg) {
            statusEl.innerHTML = `<span class="w-3 h-3 rounded-full bg-yellow-500 animate-pulse"></span><span>${msg}</span>`;
            return;
        }
        
        if (game.turn() === 'w') {
            statusEl.innerHTML = `<span class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></span><span>Your Turn (White)</span>`;
        } else {
            statusEl.innerHTML = `<span class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span><span>AI Turn (Black)</span>`;
        }
    }

    function updateAIState(text) {
        document.getElementById('ai-state').textContent = text;
    }

    // --- 4. Firebase Integration ---

    async function initApp() {
        try {
            await signInAnonymously(auth);
            
            const statsRef = doc(db, 'artifacts', appId, 'public', 'data', 'chess_stats', 'global');
            
            onSnapshot(statsRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const currentCount = data.gamesPlayed || 0;
                    
                    document.getElementById('global-counter').textContent = currentCount.toLocaleString();
                    updateGlobalProgressUI(currentCount);
                    
                    if (lastGlobalCount === -1) {
                        lastGlobalCount = currentCount;
                    }

                    const lastBatch = Math.floor(lastGlobalCount / GAMES_PER_TRAINING);
                    const currentBatch = Math.floor(currentCount / GAMES_PER_TRAINING);

                    if (currentBatch > lastBatch) {
                        console.log("Global batch complete! Training pending...");
                        trainingPending = true;
                        
                        if (game.game_over() || game.history().length === 0) {
                            checkAndTriggerTraining();
                        }
                    }
                    
                    lastGlobalCount = currentCount;

                } else {
                     setDoc(statsRef, { gamesPlayed: 0 }, { merge: true });
                     document.getElementById('global-counter').textContent = "0";
                }
            }, (error) => {
                console.error("Stats listener error:", error);
                document.getElementById('global-counter').textContent = "Offline";
            });

            await initModel();
            renderBoard();
        } catch (e) {
            console.error("Auth/Init failed:", e);
            document.getElementById('global-counter').textContent = "Offline";
            await initModel();
            renderBoard();
        }
    }

    async function incrementGlobalStats() {
         try {
            if (!auth.currentUser) return;
            const statsRef = doc(db, 'artifacts', appId, 'public', 'data', 'chess_stats', 'global');
            await updateDoc(statsRef, {
                gamesPlayed: increment(1)
            });
         } catch(e) {
             console.log("Could not update global stats", e);
         }
    }

    // --- 5. Event Listeners ---

    const iconStyleSelect = document.getElementById('icon-style');
    iconStyleSelect.value = iconStyle;
    iconStyleSelect.addEventListener('change', (e) => {
        iconStyle = e.target.value;
        localStorage.setItem('chess-icon-style', iconStyle);
        renderBoard();
    });

    document.getElementById('btn-new-game').addEventListener('click', () => {
        if (trainingPending && !isTraining) {
            checkAndTriggerTraining();
        } else {
            game.reset();
            selectedSquare = null;
            renderBoard();
            document.getElementById('move-history').innerHTML = '';
            document.getElementById('board-overlay').classList.add('hidden');
            updateAIState("Ready");
        }
    });

    document.getElementById('btn-overlay-new').addEventListener('click', () => {
        game.reset();
        selectedSquare = null;
        renderBoard();
        document.getElementById('move-history').innerHTML = '';
        document.getElementById('board-overlay').classList.add('hidden');
        updateAIState("Ready");
    });

    document.getElementById('btn-reset-ai').addEventListener('click', async () => {
        if(confirm("This will wipe the AI's memory and reset its brain. Are you sure?")) {
            try {
                localStorage.removeItem('localstorage://chess-ai-model-v2');
                await tf.io.removeModel('localstorage://chess-ai-model-v2');
            } catch(e) {
                console.log("Error removing model:", e);
            }
            location.reload();
        }
    });

    initApp();
</script>
